name: Catalyst join sweep

# This asks the website to check new Discord members: message anyone who has not yet been sent their Catalyst form, remind
# people whose 24 hours are nearly up, and remove those who did not finish in time.
# The website decides everything (it defaults to a dry run that changes nothing). See web/docs/onboarding-setup.md.
#
# This is the BACKUP timer. GitHub runs scheduled jobs on a best effort basis; checked on 30 Sep 2026 the real gaps were three
# to six hours, not the ten minutes asked for. The reliable timer is a QStash schedule that calls the same address every five
# minutes (setup step 6). The site holds a lock, so the two never run at once.
#
# Needs two repository secrets: SWEEP_URL (for example https://edith-plum.vercel.app/api/join/sweep) and CRON_SECRET
# (the same value as the CRON_SECRET setting on Vercel). Without them this job does nothing.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: join-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Skip when the secrets are not set
        id: check
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SWEEP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "SWEEP_URL or CRON_SECRET is not set, skipping."; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Run the sweep
        if: steps.check.outputs.run == 'true'
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SWEEP_URL" | tee sweep.json
          echo
